<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مقایسه اعداد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 25px;
    padding: 30px 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 { color: #4a3f8f; font-size: 26px; margin-bottom: 5px; }
  .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
  .score-bar {
    display: flex;
    justify-content: space-around;
    background: #f3f0ff;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 25px;
    font-weight: 700;
    color: #4a3f8f;
    font-size: 14px;
  }
  .question-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    font-size: 28px;
    font-weight: 700;
    color: #333;
    margin: 30px 0;
    direction: ltr;
    flex-wrap: wrap;
  }
  .number {
    background: #eef2ff;
    padding: 12px 20px;
    border-radius: 12px;
    border: 2px dashed #a5b4fc;
    min-width: 120px;
  }
  .circle-slot {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid #764ba2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #764ba2;
    background: #fff;
    transition: all 0.3s;
  }
  .circle-slot.correct {
    background: #4ade80;
    border-color: #16a34a;
    color: white;
    transform: scale(1.15);
  }
  .circle-slot.wrong {
    background: #f87171;
    border-color: #dc2626;
    color: white;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
  }
  .btn-sign {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: none;
    font-size: 42px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .btn-sign:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .btn-sign:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-gt { background: #3b82f6; }
  .btn-eq { background: #f59e0b; }
  .btn-lt { background: #10b981; }
  .feedback {
    margin-top: 20px;
    font-size: 20px;
    font-weight: 700;
    min-height: 30px;
  }
  .feedback.ok { color: #16a34a; }
  .feedback.no { color: #dc2626; }
  .next-btn {
    margin-top: 15px;
    padding: 12px 40px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #764ba2;
    color: white;
    cursor: pointer;
    display: none;
    box-shadow: 0 5px 0 #5a3780;
  }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a3780; }
  .end-screen { display: none; }
  .end-screen h2 { color: #4a3f8f; font-size: 24px; }
  .end-screen .final-score { font-size: 48px; color: #764ba2; margin: 15px 0; }
  .restart-btn {
    padding: 14px 45px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #10b981;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #0d8f66;
  }
  .restart-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0d8f66; }
</style>
</head>
<body>
<div class="container">
  <div id="gameScreen">
    <h1>🎯 علامت بگذار!</h1>
    <p class="subtitle">عدد بزرگ‌تر را پیدا کن و علامت مناسب را انتخاب کن</p>

    <div class="score-bar">
      <span>✅ درست: <span id="correctCount">۰</span></span>
      <span>❌ غلط: <span id="wrongCount">۰</span></span>
      <span>📊 <span id="progressText">۱/۱۰</span></span>
    </div>

    <div class="question-box">
      <span class="number" id="num1">۰</span>
      <div class="circle-slot" id="circleSlot">؟</div>
      <span class="number" id="num2">۰</span>
    </div>

    <div class="buttons">
      <button class="btn-sign btn-gt" data-sign="&gt;" title="بزرگ‌تر از">></button>
      <button class="btn-sign btn-eq" data-sign="=" title="مساوی">=</button>
      <button class="btn-sign btn-lt" data-sign="&lt;" title="کوچک‌تر از"><</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">سؤال بعدی ➡</button>
  </div>

  <div class="end-screen" id="endScreen">
    <h2>🎉 بازی تمام شد!</h2>
    <p>امتیاز نهایی شما:</p>
    <div class="final-score"><span id="finalScore">0</span> از <span id="totalQuestions">10</span></div>
    <p id="endMessage"></p>
    <button class="restart-btn" id="restartBtn">🔄 دوباره بازی کن</button>
  </div>
</div>

<script>
const TOTAL_QUESTIONS = 10;
const toFa = (n) => n.toLocaleString('fa-IR');

function generateQuestion() {
  const type = Math.random();
  let a, b;
  if (type < 0.15) {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    b = a;
  } else if (type < 0.5) {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    const diff = Math.floor(Math.random() * 5000) + 1;
    b = Math.random() > 0.5 ? a + diff : a - diff;
  } else {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    b = Math.floor(Math.random() * 9000000) + 1000000;
  }
  return { a, b };
}

let currentQuestion, correctCount, wrongCount, questionNumber, answered;

function startGame() {
  correctCount = 0;
  wrongCount = 0;
  questionNumber = 0;
  document.getElementById('correctCount').textContent = '۰';
  document.getElementById('wrongCount').textContent = '۰';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  if (questionNumber >= TOTAL_QUESTIONS) {
    endGame();
    return;
  }
  currentQuestion = generateQuestion();
  answered = false;

  const { a, b } = currentQuestion;
  document.getElementById('num1').textContent = toFa(a);
  document.getElementById('num2').textContent = toFa(b);

  const slot = document.getElementById('circleSlot');
  slot.textContent = '؟';
  slot.className = 'circle-slot';

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  document.querySelectorAll('.btn-sign').forEach(btn => btn.disabled = false);

  document.getElementById('progressText').textContent =
    toFa(questionNumber + 1) + '/' + toFa(TOTAL_QUESTIONS);
}

function getCorrectSign(a, b) {
  if (a > b) return '>';
  if (a < b) return '<';
  return '=';
}

function checkAnswer(userSign) {
  if (answered) return;
  answered = true;

  const { a, b } = currentQuestion;
  const correctSign = getCorrectSign(a, b);
  const slot = document.getElementById('circleSlot');
  const feedback = document.getElementById('feedback');

  document.querySelectorAll('.btn-sign').forEach(btn => btn.disabled = true);

  if (userSign === correctSign) {
    correctCount++;
    document.getElementById('correctCount').textContent = toFa(correctCount);
    slot.textContent = userSign;
    slot.classList.add('correct');
    feedback.textContent = '✅ آفرین! درست بود';
    feedback.className = 'feedback ok';
  } else {
    wrongCount++;
    document.getElementById('wrongCount').textContent = toFa(wrongCount);
    slot.textContent = correctSign;
    slot.classList.add('wrong');
    feedback.textContent = `❌ اشتباه بود! پاسخ درست: ${correctSign}`;
    feedback.className = 'feedback no';
  }

  questionNumber++;
  document.getElementById('nextBtn').style.display = 'inline-block';
  if (questionNumber >= TOTAL_QUESTIONS) {
    document.getElementById('nextBtn').textContent = '🏁 دیدن نتیجه';
  } else {
    document.getElementById('nextBtn').textContent = 'سؤال بعدی ➡';
  }
}

function endGame() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = toFa(correctCount);
  document.getElementById('totalQuestions').textContent = toFa(TOTAL_QUESTIONS);

  const msg = document.getElementById('endMessage');
  const percent = (correctCount / TOTAL_QUESTIONS) * 100;
  if (percent === 100) msg.textContent = '🏆 عالی! همه را درست زدی!';
  else if (percent >= 70) msg.textContent = '👏 خیلی خوب بود! ادامه بده.';
  else if (percent >= 50) msg.textContent = '💪 خوب بود، با کمی تمرین بهتر می‌شوی.';
  else msg.textContent = '📚 تمرین بیشتری لازم است. دوباره تلاش کن!';
}

document.querySelectorAll('.btn-sign').forEach(btn => {
  btn.addEventListener('click', () => {
    checkAnswer(btn.dataset.sign);
  });
});

document.getElementById('nextBtn').addEventListener('click', loadQuestion);
document.getElementById('restartBtn').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
