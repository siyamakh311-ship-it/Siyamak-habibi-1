<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی مقایسه اعداد</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
    padding: 15px;
  }
  .container {
    background: white;
    border-radius: 25px;
    padding: 25px 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    max-width: 600px;
    width: 100%;
    text-align: center;
  }
  h1 { color: #4a3f8f; font-size: 22px; margin-bottom: 5px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 15px; }
  .score-bar {
    display: flex;
    justify-content: space-around;
    background: #f3f0ff;
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 20px;
    font-weight: 700;
    color: #4a3f8f;
    font-size: 13px;
  }
  .question-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 25px 0;
    flex-wrap: nowrap;
    direction: ltr;
  }
  .number {
    background: #eef2ff;
    padding: 18px 12px;
    border-radius: 15px;
    border: 3px solid #a5b4fc;
    min-width: 110px;
    direction: ltr;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .number:hover {
    background: #dbeafe;
    transform: translateY(-3px);
  }
  .number:active {
    transform: translateY(0);
  }
  .number.correct {
    background: #4ade80;
    border-color: #16a34a;
    color: white;
  }
  .number.wrong {
    background: #f87171;
    border-color: #dc2626;
    color: white;
    animation: shake 0.4s;
  }
  .number.disabled {
    pointer-events: none;
    opacity: 0.6;
  }
  .circle-slot {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid #764ba2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #764ba2;
    background: #fff;
    transition: all 0.3s;
    direction: ltr;
    font-weight: 700;
    flex-shrink: 0;
  }
  .circle-slot.correct {
    background: #4ade80;
    border-color: #16a34a;
    color: white;
    transform: scale(1.15);
  }
  .circle-slot.wrong {
    background: #f87171;
    border-color: #dc2626;
    color: white;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  .hint {
    font-size: 14px;
    color: #764ba2;
    background: #f3f0ff;
    padding: 10px;
    border-radius: 10px;
    margin-top: 15px;
    font-weight: 700;
  }
  .feedback {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 700;
    min-height: 30px;
  }
  .feedback.ok { color: #16a34a; }
  .feedback.no { color: #dc2626; }
  .next-btn {
    margin-top: 15px;
    padding: 12px 40px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #764ba2;
    color: white;
    cursor: pointer;
    display: none;
    box-shadow: 0 5px 0 #5a3780;
    font-family: 'Vazirmatn', sans-serif;
  }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5a3780; }
  .end-screen { display: none; }
  .end-screen h2 { color: #4a3f8f; font-size: 24px; }
  .end-screen .final-score { font-size: 48px; color: #764ba2; margin: 15px 0; }
  .restart-btn {
    padding: 14px 45px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    background: #10b981;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 0 #0d8f66;
    font-family: 'Vazirmatn', sans-serif;
  }
  .restart-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0d8f66; }
</style>
</head>
<body>
<div class="container">
  <div id="gameScreen">
    <h1>🦈 دهن کوسه به کدوم طرفه؟</h1>
    <p class="subtitle">روی عدد بزرگ‌تر کلیک کن</p>

    <div class="score-bar">
      <span>✅ درست: <span id="correctCount">۰</span></span>
      <span>❌ غلط: <span id="wrongCount">۰</span></span>
      <span>📊 <span id="progressText">۱/۱۰</span></span>
    </div>

    <div class="question-box">
      <span class="number" id="num1" onclick="answer('left')">۰</span>
      <div class="circle-slot" id="circleSlot">؟</div>
      <span class="number" id="num2" onclick="answer('right')">۰</span>
    </div>

    <div class="hint">💡 دهن کوسه به سمت عدد بزرگ‌تر باز می‌شه</div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">سؤال بعدی ➡</button>
  </div>

  <div class="end-screen" id="endScreen">
    <h2>🎉 بازی تمام شد!</h2>
    <p>امتیاز نهایی شما:</p>
    <div class="final-score"><span id="finalScore">0</span> از <span id="totalQuestions">10</span></div>
    <p id="endMessage"></p>
    <button class="restart-btn" id="restartBtn">🔄 دوباره بازی کن</button>
  </div>
</div>

<script>
const TOTAL_QUESTIONS = 10;
const toFa = (n) => n.toLocaleString('fa-IR');

function generateQuestion() {
  const type = Math.random();
  let a, b;
  if (type < 0.15) {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    b = a;
  } else if (type < 0.5) {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    const diff = Math.floor(Math.random() * 5000) + 1;
    b = Math.random() > 0.5 ? a + diff : a - diff;
  } else {
    a = Math.floor(Math.random() * 9000000) + 1000000;
    b = Math.floor(Math.random() * 9000000) + 1000000;
  }
  return { a, b };
}

let currentQuestion, correctCount, wrongCount, questionNumber, answered;

function startGame() {
  correctCount = 0;
  wrongCount = 0;
  questionNumber = 0;
  document.getElementById('correctCount').textContent = '۰';
  document.getElementById('wrongCount').textContent = '۰';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('endScreen').style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  if (questionNumber >= TOTAL_QUESTIONS) {
    endGame();
    return;
  }
  currentQuestion = generateQuestion();
  answered = false;

  const { a, b } = currentQuestion;
  const num1El = document.getElementById('num1');
  const num2El = document.getElementById('num2');

  num1El.textContent = toFa(a);
  num2El.textContent = toFa(b);
  num1El.className = 'number';
  num2El.className = 'number';

  const slot = document.getElementById('circleSlot');
  slot.textContent = '؟';
  slot.className = 'circle-slot';

  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  document.getElementById('progressText').textContent =
    toFa(questionNumber + 1) + '/' + toFa(TOTAL_QUESTIONS);
}

// تعیین علامت درست (دهن به سمت عدد بزرگ‌تر)
// چیدمان: [a]  [علامت]  [b]   (a سمت چپ، b سمت راست)
function getCorrectSign(a, b) {
  if (a > b) return '>';   // a بزرگ‌تره، دهن به سمت چپ (a) بازه
  if (a < b) return '<';   // b بزرگ‌تره، دهن به سمت راست (b) بازه
  return '=';
}

// کاربر روی کدوم عدد کلیک کرد؟
// left = عدد a (سمت چپ)، right = عدد b (سمت راست)
function answer(side) {
  if (answered) return;
  answered = true;

  const { a, b } = currentQuestion;
  const correctSign = getCorrectSign(a, b);
  const slot = document.getElementById('circleSlot');
  const feedback = document.getElementById('feedback');
  const num1El = document.getElementById('num1');
  const num2El = document.getElementById('num2');

  // عدد بزرگ‌تر کدومه؟
  let correctSide;
  if (a > b) correctSide = 'left';
  else if (a < b) correctSide = 'right';
  else correctSide = 'equal';

  // علامت درست رو توی دایره نشون بده
  slot.textContent = correctSign;

  if (side === correctSide || (correctSide === 'equal' && side === 'left')) {
    correctCount++;
    document.getElementById('correctCount').textContent = toFa(correctCount);
    slot.classList.add('correct');
    if (side === 'left') num1El.classList.add('correct');
    else num2El.classList.add('correct');
    feedback.textContent = '✅ آفرین! درست بود';
    feedback.className = 'feedback ok';
  } else {
    wrongCount++;
    document.getElementById('wrongCount').textContent = toFa(wrongCount);
    slot.classList.add('wrong');
    if (side === 'left') num1El.classList.add('wrong');
    else num2El.classList.add('wrong');
    if (correctSide === 'left') num1El.classList.add('correct');
    else if (correctSide === 'right') num2El.classList.add('correct');
    feedback.textContent = `❌ اشتباه بود! دهن کوسه باید به سمت ${correctSide === 'left' ? 'عدد چپ' : correctSide === 'right' ? 'عدد راست' : 'هیچ‌کدام (مساوی)'} باز بشه`;
    feedback.className = 'feedback no';
  }

  num1El.classList.add('disabled');
  num2El.classList.add('disabled');

  questionNumber++;
  document.getElementById('nextBtn').style.display = 'inline-block';
  if (questionNumber >= TOTAL_QUESTIONS) {
    document.getElementById('nextBtn').textContent = '🏁 دیدن نتیجه';
  } else {
    document.getElementById('nextBtn').textContent = 'سؤال بعدی ➡';
  }
}

function endGame() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('endScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = toFa(correctCount);
  document.getElementById('totalQuestions').textContent = toFa(TOTAL_QUESTIONS);

  const msg = document.getElementById('endMessage');
  const percent = (correctCount / TOTAL_QUESTIONS) * 100;
  if (percent === 100) msg.textContent = '🏆 عالی! همه را درست زدی!';
  else if (percent >= 70) msg.textContent = '👏 خیلی خوب بود! ادامه بده.';
  else if (percent >= 50) msg.textContent = '💪 خوب بود، با کمی تمرین بهتر می‌شوی.';
  else msg.textContent = '📚 تمرین بیشتری لازم است. دوباره تلاش کن!';
}

document.getElementById('nextBtn').addEventListener('click', loadQuestion);
document.getElementById('restartBtn').addEventListener('click', startGame);

startGame();
</script>
</body>
</html>
